<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EATCO Email Signature</title>
</head>
<body style="margin:0; padding:20px; background:#ffffff;">

<!-- ===== SIGNATURE START ===== -->
<table cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px; max-width:600px; border-collapse:collapse; font-family:Arial, Helvetica, sans-serif; background:#ffffff;">

  <!-- Logo -->
  <tr>
    <td align="center" style="padding:10px 0 12px 0;">
      <a href="https://www.instagram.com/eatcooman/" target="_blank" style="text-decoration:none;">
        <img src="https://arhumayunarain.github.io/email-signature/images/eatco-logo.png" width="96" alt="EATCO" style="display:block; width:96px; height:auto; border:0; outline:none;">
      </a>
    </td>
  </tr>

  <!-- Tagline -->
  <tr>
    <td align="center" style="padding:0 0 12px 0; font-family:Arial, Helvetica, sans-serif; font-size:22px; line-height:28px; font-weight:bold; color:#533B65; text-transform:uppercase; letter-spacing:0.3px;">
      The Heart of Oman's Cultural Experiences
    </td>
  </tr>

  <!-- Pink rule -->
  <tr>
    <td style="padding:0 0 20px 0;">
      <table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;">
        <tr><td height="3" style="height:3px; line-height:3px; font-size:0; background:#C8417F;">&nbsp;</td></tr>
      </table>
    </td>
  </tr>

  <!-- Three events in one row -->
  <tr>
    <td>
      <table cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px; border-collapse:collapse;">
        <tr>
          <td width="200" align="center" valign="middle" style="width:200px; padding:0 15px;">
            <a href="https://www.instagram.com/muscateat/" target="_blank" style="text-decoration:none;">
              <img src="https://arhumayunarain.github.io/email-signature/images/muscat-eat.png" width="170" alt="Muscat Eat - Oman's Biggest Festival" style="display:block; width:170px; height:auto; border:0; outline:none;">
            </a>
          </td>
          <td width="200" align="center" valign="middle" style="width:200px; padding:0 15px; border-left:2px solid #C8417F;">
            <a href="https://www.instagram.com/maiff_om/" target="_blank" style="text-decoration:none;">
              <img src="https://arhumayunarain.github.io/email-signature/images/maiff.png" width="160" alt="Muscat AI Film Festival" style="display:block; width:160px; height:auto; border:0; outline:none;">
            </a>
          </td>
          <td width="200" align="center" valign="middle" style="width:200px; padding:0 15px; border-left:2px solid #C8417F;">
            <a href="https://www.instagram.com/eatcosport/" target="_blank" style="text-decoration:none;">
              <img src="https://arhumayunarain.github.io/email-signature/images/run-2.png" width="170" alt="Run 2.0 - Nizwa Edition" style="display:block; width:170px; height:auto; border:0; outline:none;">
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>

</table>
<!-- ===== SIGNATURE END ===== -->

</body>
</html>
